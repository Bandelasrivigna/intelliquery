<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntelliQuery — Ask your data in plain English</title>
<style>
:root{--accent:#4da3ff;--bg:#0f1115;--card:#171a21;--text:#e8eaed;--muted:#9aa4b2}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:48px 24px}
h1{font-size:2rem}.sub{color:var(--muted);margin:8px 0 28px}
.box{display:flex;gap:10px}
input{flex:1;background:var(--card);border:1px solid #232733;color:var(--text);padding:14px 16px;border-radius:10px;font-size:1rem}
button{background:var(--accent);border:0;color:#04101f;font-weight:700;padding:0 22px;border-radius:10px;cursor:pointer}
.chips{margin:14px 0 4px;display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:var(--card);border:1px solid #232733;color:var(--muted);padding:6px 12px;border-radius:16px;font-size:.85rem;cursor:pointer}
.panel{background:var(--card);border:1px solid #232733;border-radius:12px;padding:18px;margin-top:22px;display:none}
.label{color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
pre{background:#0b0d12;border:1px solid #232733;border-radius:8px;padding:12px;overflow:auto;color:#d6e2f0;font-size:.9rem}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.9rem}
th,td{border-bottom:1px solid #232733;padding:8px 10px;text-align:left}
th{color:#fff}.err{color:#ff8080}
.badge{float:right;font-size:.72rem;color:var(--muted)}
</style></head>
<body><div class="wrap">
<h1>IntelliQuery</h1>
<p class="sub">Ask a question about the data in plain English. IntelliQuery retrieves the schema, generates safe SQL, and runs it.</p>
<div class="box">
  <input id="q" placeholder="e.g. What is the revenue by product?" />
  <button onclick="ask()">Ask</button>
</div>
<div class="chips">
  <span onclick="fill(this)">Revenue by product</span>
  <span onclick="fill(this)">Top selling product</span>
  <span onclick="fill(this)">Customers in USA</span>
  <span onclick="fill(this)">How many completed orders</span>
  <span onclick="fill(this)">Orders per customer</span>
</div>
<div class="panel" id="panel">
  <div class="label">Generated SQL <span class="badge" id="mode"></span></div>
  <pre id="sql"></pre>
  <div id="result"></div>
</div>
<script>
function fill(el){document.getElementById('q').value=el.textContent;ask();}
async function ask(){
  const question=document.getElementById('q').value.trim();if(!question)return;
  const panel=document.getElementById('panel');panel.style.display='block';
  document.getElementById('sql').textContent='...';document.getElementById('result').innerHTML='';
  try{
    const r=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    const d=await r.json();
    document.getElementById('mode').textContent=d.mode?('mode: '+d.mode):'';
    if(d.error){document.getElementById('sql').textContent=d.sql||'';document.getElementById('result').innerHTML='<p class="err">'+d.error+'</p>';return;}
    document.getElementById('sql').textContent=d.sql;
    if(!d.rows||!d.rows.length){document.getElementById('result').innerHTML='<p style="color:var(--muted)">No rows.</p>';return;}
    let h='<table><tr>'+d.columns.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
    d.rows.forEach(row=>{h+='<tr>'+d.columns.map(c=>'<td>'+row[c]+'</td>').join('')+'</tr>';});
    h+='</table>';document.getElementById('result').innerHTML=h;
  }catch(e){document.getElementById('result').innerHTML='<p class="err">Request failed: '+e+'</p>';}
}
</script>
</div></body></html>
